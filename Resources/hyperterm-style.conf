# Loaded before the user's Ghostty config, so any of these they set themselves wins.

# Kuronami's Graphite look: terminals are opaque charcoal panes on a near-black canvas, with a
# blue cursor matching the app's focus color. Text gets room to breathe.
window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
background = 101012
foreground = ededef
background-opacity = 1
cursor-color = 5b8cff
cursor-style = bar
selection-background = 22304d
selection-foreground = f4f6fb
adjust-cell-height = 8%
