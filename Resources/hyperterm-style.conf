# Loaded before the user's Ghostty config, so any of these they set themselves wins.

# Kuronami's ink look: terminals are warm sumi-black panes with bone text, and a vermilion
# cursor matching the app's focus color. Text gets room to breathe.
window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
background = 121110
foreground = e8e3d8
background-opacity = 1
cursor-color = d94a33
cursor-style = bar
selection-background = 3b2721
selection-foreground = f3eee4
adjust-cell-height = 8%
