# Loaded after the user's Ghostty config. Keep this list short: the user's config should win
# everywhere except where Hyperterm manages the behavior itself.

# Hyperterm owns session lifecycle and asks before closing running agents itself.
confirm-close-surface = false

# Terminals sit in rounded panes on a glass window: give text room to breathe and let the
# window's blur show faintly through the background.
window-padding-x = 14
window-padding-y = 10
window-padding-balance = true
background-opacity = 0.9
