name: Hyperterm
options:
  bundleIdPrefix: dev.hyperterm
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  # Embedded Chromium for the browser pane. Pinned to a tested commit (CEF 154).
  CefSwift:
    url: https://github.com/Rajaniraiyn/CefSwift
    revision: 59cad64e124b8efdb6b2ee811963097bb6e689e8
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Hyperterm:
    type: application
    platform: macOS
    sources:
      - path: Sources/Hyperterm
      - path: Sources/Shared
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/terminfo
        type: folder
        buildPhase: resources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - framework: GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Carbon.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
      - target: ht
        embed: false
        link: false
      - target: HypertermHelper
        embed: false
        link: false
      - package: CefSwift
        product: CefSwiftUI
    info:
      path: Sources/Hyperterm/App/Info.plist
      properties:
        CFBundleName: Kuronami
        CFBundleDisplayName: Kuronami
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
        # Chromium's allocator is incompatible with the Nano malloc zone.
        LSEnvironment:
          MallocNanoZone: "0"
        NSSupportsAutomaticGraphicsSwitching: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hyperterm.app
        # The product is Kuronami; the Swift module keeps its original name.
        PRODUCT_NAME: Kuronami
        PRODUCT_MODULE_NAME: Hyperterm
        OTHER_LDFLAGS: "-lc++"
    postBuildScripts:
      - name: Embed ht CLI
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin"
          cp -f "$BUILT_PRODUCTS_DIR/ht" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/ht"
          codesign --force --sign - "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/ht"
        basedOnDependencyAnalysis: false
      - name: Copy Kuronami terminal defaults
        script: |
          # The tracked config files are the source of truth; Resources/ghostty is only refreshed
          # when libghostty is rebuilt, so copy them into the bundle on every build.
          cp -f "$SRCROOT/Resources/hyperterm-style.conf" "$SRCROOT/Resources/hyperterm-defaults.conf" \
            "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/ghostty/"
        basedOnDependencyAnalysis: false
      - name: Embed Chromium
        script: |
          "$SRCROOT/scripts/embed-cef.sh"
        basedOnDependencyAnalysis: false
  # Chromium's renderer/GPU/utility processes; embed-cef.sh copies it into five helper apps.
  HypertermHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/HypertermHelper
    dependencies:
      - package: CefSwift
        product: CefKit
    settings:
      base:
        PRODUCT_NAME: HypertermHelper
  ht:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ht
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_NAME: ht
  HypertermTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HypertermTests
    dependencies:
      - target: Hyperterm
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kuronami.app/Contents/MacOS/Kuronami"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hyperterm:
    build:
      targets:
        Hyperterm: all
        ht: all
    test:
      targets:
        - HypertermTests
